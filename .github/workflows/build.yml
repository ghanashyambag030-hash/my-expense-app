name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/myexpense/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp app_icon.png app/src/main/res/drawable/app_icon.png

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExpenseApp"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.myexpense.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.myexpense.app'
                  minSdk 24
                  targetSdk 35

                  versionCode 3
                  versionName '1.2'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.17.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="আমার হিসাব"
                  android:icon="@drawable/app_icon"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/myexpense/app/MainActivity.java <<'EOF'
          package com.myexpense.app;

          import android.app.Activity;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;

          import androidx.annotation.NonNull;
          import androidx.annotation.RequiresApi;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {

              private WebView webView;

              private static class LocalContentWebViewClient
                      extends WebViewClientCompat {

                  private final WebViewAssetLoader assetLoader;

                  LocalContentWebViewClient(
                          WebViewAssetLoader assetLoader) {
                      this.assetLoader = assetLoader;
                  }

                  @Override
                  @RequiresApi(21)
                  public WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          @NonNull WebResourceRequest request) {

                      return assetLoader.shouldInterceptRequest(
                              request.getUrl()
                      );
                  }

                  @Override
                  @SuppressWarnings("deprecation")
                  public WebResourceResponse shouldInterceptRequest(
                          WebView view,
                          String url) {

                      return assetLoader.shouldInterceptRequest(
                              Uri.parse(url)
                      );
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings =
                          webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  WebViewAssetLoader assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader
                                                  .AssetsPathHandler(this)
                                  )
                                  .build();

                  webView.setWebViewClient(
                          new LocalContentWebViewClient(
                                  assetLoader
                          )
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient()
                  );

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }
          }
          EOF

      - name: Clean and Build APK
        run: |
          gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expense-App-v3
          path: app/build/outputs/apk/debug/app-debug.apk
