<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>আমার দৈনন্দিন হিসাব</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 min-height:100%;
}

body{
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:linear-gradient(180deg,#f7fbff,#eef7f4);
 color:#263238;
}

/* =========================
   HEADER
========================= */

header{
 background:linear-gradient(135deg,#00a878,#00c9a7);
 color:#fff;
 padding:22px 15px 25px;
 text-align:center;
 border-radius:0 0 25px 25px;
 box-shadow:0 6px 20px #0002;
}

header h1{
 margin:0;
 font-size:25px;
}

header p{
 margin:6px 0 0;
 font-size:13px;
}

/* =========================
   MAIN
========================= */

.container{
 width:100%;
 max-width:900px;
 margin:0 auto;
 padding:15px 14px 35px;
}

/* =========================
   TOP ICONS
========================= */

.toolbar{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin:12px 0;
}

.tool{
 width:100%;
 background:#fff;
 border:1px solid #e5eeee;
 border-radius:14px;
 padding:11px 5px;
 text-align:center;
 font-weight:700;
 font-size:12px;
 box-shadow:0 3px 10px #0000000d;
 color:#263238;
}

.tool span{
 display:block;
 font-size:22px;
 margin-bottom:3px;
}

.tool:active{
 transform:scale(.97);
}

/* =========================
   SUMMARY
========================= */

.summary{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:9px;
 margin-bottom:15px;
}

.card,
.box{
 background:#fff;
 border-radius:18px;
 box-shadow:0 4px 15px #0000000d;
 border:1px solid #e8eeee;
}

.card{
 padding:13px 6px;
 text-align:center;
}

.card h3{
 margin:0;
 color:#607d8b;
 font-size:11px;
}

.card .value{
 margin-top:6px;
 font-size:17px;
 font-weight:800;
}

.income-value{
 color:#00897b;
}

.expense-value{
 color:#e53935;
}

.balance-value{
 color:#1565c0;
}

.month-value{
 color:#6a1b9a;
}

.year-value{
 color:#ef6c00;
}

/* =========================
   SECTION
========================= */

.section{
 margin-top:15px;
 padding:15px;
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
}

.section-title h2{
 margin:0;
 font-size:18px;
}

.section-title button{
 border:0;
 background:#e8f5e9;
 color:#00897b;
 border-radius:10px;
 padding:8px 11px;
 font-weight:700;
}

/* =========================
   FORM
========================= */

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.field.full{
 grid-column:1/-1;
}

.field label{
 font-size:12px;
 color:#607d8b;
 font-weight:700;
}

.field input,
.field select,
.field textarea{
 width:100%;
 border:1px solid #dce7e7;
 border-radius:11px;
 padding:11px;
 outline:none;
 background:#fbfefe;
 color:#263238;
 font-size:14px;
}

.field textarea{
 min-height:80px;
 resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
 border-color:#00a878;
 box-shadow:0 0 0 3px #00a87818;
}

.form-actions{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
 border:0;
 border-radius:11px;
 padding:11px 15px;
 font-weight:800;
 cursor:pointer;
}

.primary-btn{
 background:#00a878;
 color:#fff;
}

.secondary-btn{
 background:#eceff1;
 color:#37474f;
}

.danger-btn{
 background:#ffebee;
 color:#c62828;
}

.primary-btn:active,
.secondary-btn:active,
.danger-btn:active{
 transform:scale(.98);
}

/* =========================
   FILTER
========================= */

.filter-box{
 margin-top:15px;
 padding:12px;
}

.filter-row{
 display:grid;
 grid-template-columns:1.2fr 1fr 1fr;
 gap:8px;
}

.filter-row input,
.filter-row select{
 width:100%;
 padding:10px;
 border:1px solid #dce7e7;
 border-radius:10px;
 background:#fff;
 outline:none;
}

/* =========================
   LIST
========================= */

.list{
 display:flex;
 flex-direction:column;
 gap:9px;
 margin-top:12px;
}

.empty{
 text-align:center;
 padding:25px 10px;
 color:#90a4ae;
 font-size:14px;
}

.item{
 background:#fff;
 border:1px solid #e7eeee;
 border-radius:15px;
 padding:12px;
 box-shadow:0 3px 12px #0000000b;
}

.item-top{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:10px;
}

.item-main{
 min-width:0;
 flex:1;
}

.item-name{
 font-weight:800;
 font-size:15px;
 word-break:break-word;
}

.item-meta{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:5px;
 align-items:center;
}

.badge{
 display:inline-flex;
 align-items:center;
 background:#e8f5e9;
 color:#2e7d32;
 border-radius:20px;
 padding:3px 8px;
 font-size:11px;
 font-weight:700;
}

.date-badge{
 background:#e3f2fd;
 color:#1565c0;
}

.item-note{
 margin-top:6px;
 color:#78909c;
 font-size:12px;
 white-space:pre-wrap;
 word-break:break-word;
}

.amount{
 font-size:17px;
 font-weight:900;
 white-space:nowrap;
}

.amount.expense{
 color:#e53935;
}

.amount.income{
 color:#00897b;
}

.item-actions{
 display:flex;
 gap:6px;
 margin-top:9px;
}

.item-actions button{
 border:0;
 border-radius:9px;
 padding:7px 10px;
 font-size:11px;
 font-weight:700;
}

.edit-btn{
 background:#e3f2fd;
 color:#1565c0;
}

.delete-btn{
 background:#ffebee;
 color:#c62828;
}

/* =========================
   CATEGORY MANAGER
========================= */

.category-list{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px;
}

.category-chip{
 display:flex;
 align-items:center;
 gap:6px;
 background:#f1f8e9;
 border:1px solid #dcedc8;
 color:#558b2f;
 padding:7px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:700;
}

.category-chip button{
 border:0;
 background:transparent;
 color:#c62828;
 font-size:14px;
 font-weight:900;
 padding:0;
}

/* =========================
   MODAL
========================= */

.modal{
 position:fixed;
 inset:0;
 background:#0007;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:1000;
}

.modal.show{
 display:flex;
}

.modal-box{
 width:100%;
 max-width:500px;
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:20px;
 padding:18px;
 box-shadow:0 15px 50px #0005;
}

.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:15px;
}

.modal-head h2{
 margin:0;
 font-size:19px;
}

.close-btn{
 border:0;
 background:#eceff1;
 width:34px;
 height:34px;
 border-radius:50%;
 font-size:18px;
}

/* =========================
   CHART
========================= */

.chart-area{
 min-height:300px;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.chart-bar-row{
 display:grid;
 grid-template-columns:90px 1fr 70px;
 gap:7px;
 align-items:center;
}

.chart-label{
 font-size:11px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.chart-track{
 height:22px;
 background:#eceff1;
 border-radius:20px;
 overflow:hidden;
}

.chart-bar{
 height:100%;
 background:linear-gradient(90deg,#00a878,#00c9a7);
 border-radius:20px;
 min-width:2px;
}

.chart-value{
 font-size:11px;
 font-weight:800;
 text-align:right;
}

.donut-wrap{
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:250px;
}

.donut{
 width:220px;
 height:220px;
 border-radius:50%;
 position:relative;
 background:conic-gradient(
   #00a878 0deg 90deg,
   #42a5f5 90deg 160deg,
   #ffca28 160deg 220deg,
   #ef5350 220deg 280deg,
   #ab47bc 280deg 360deg
 );
}

.donut::after{
 content:"";
 position:absolute;
 width:110px;
 height:110px;
 background:#fff;
 border-radius:50%;
 top:55px;
 left:55px;
}

.chart-legend{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:8px;
}

.legend-item{
 display:flex;
 align-items:center;
 gap:5px;
 font-size:11px;
}

.legend-dot{
 width:10px;
 height:10px;
 border-radius:50%;
}

/* =========================
   CONFIRM
========================= */

.confirm-text{
 text-align:center;
 color:#546e7a;
 line-height:1.6;
 margin:8px 0 18px;
}

.confirm-actions{
 display:flex;
 gap:8px;
 justify-content:center;
}

/* =========================
   TOAST
========================= */

.toast{
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translateX(-50%) translateY(100px);
 background:#263238;
 color:#fff;
 padding:11px 17px;
 border-radius:12px;
 font-size:13px;
 font-weight:700;
 opacity:0;
 pointer-events:none;
 transition:.3s;
 z-index:2000;
 max-width:90%;
 text-align:center;
}

.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

 .summary{
  grid-template-columns:repeat(3,1fr);
 }

 .toolbar{
  grid-template-columns:repeat(4,1fr);
 }

}

@media(max-width:500px){

 header{
  padding:18px 12px 21px;
 }

 header h1{
  font-size:22px;
 }

 .container{
  padding:12px 10px 30px;
 }

 .summary{
  grid-template-columns:repeat(2,1fr);
 }

 .form-grid{
  grid-template-columns:1fr;
 }

 .field.full{
  grid-column:auto;
 }

 .filter-row{
  grid-template-columns:1fr;
 }

 .toolbar{
  grid-template-columns:repeat(2,1fr);
 }

 .chart-bar-row{
  grid-template-columns:70px 1fr 60px;
 }

}
</style>
</head>

<body>

<header>
 <h1>আমার দৈনন্দিন হিসাব</h1>
 <p>আয়, খরচ এবং ব্যালেন্স সহজে হিসাব রাখুন</p>
</header>

<main class="container">

 <!-- TOOLBAR -->
 <div class="toolbar">

  <button class="tool" type="button" onclick="openChartModal()">
   <span>📊</span>
   চার্ট
  </button>

  <button class="tool" type="button" onclick="openCategoryModal()">
   <span>🏷️</span>
   ক্যাটাগরি
  </button>

  <button class="tool" type="button" onclick="backupData()">
   <span>💾</span>
   ব্যাকআপ
  </button>

  <button class="tool" type="button" onclick="document.getElementById('restoreInput').click()">
   <span>📂</span>
   রিস্টোর
  </button>

 </div>

 <input
  type="file"
  id="restoreInput"
  accept=".json,application/json"
  style="display:none"
  onchange="restoreData(event)"
 >

 <!-- SUMMARY -->
 <section class="summary">

  <div class="card">
   <h3>আজকের খরচ</h3>
   <div class="value expense-value" id="todayExpense">₹0.00</div>
  </div>

  <div class="card">
   <h3>এই মাসের খরচ</h3>
   <div class="value month-value" id="monthExpense">₹0.00</div>
  </div>

  <div class="card">
   <h3>এই বছরের খরচ</h3>
   <div class="value year-value" id="yearExpense">₹0.00</div>
  </div>

  <div class="card">
   <h3>এই মাসের আয়</h3>
   <div class="value income-value" id="monthIncome">₹0.00</div>
  </div>

  <div class="card">
   <h3>ব্যালেন্স</h3>
   <div class="value balance-value" id="monthBalance">₹0.00</div>
  </div>

 </section>

 <!-- INCOME -->
 <section class="section box">

  <div class="section-title">
   <h2>💰 আয় যোগ করুন</h2>
  </div>

  <form id="incomeForm" onsubmit="saveIncome(event)">

   <input type="hidden" id="incomeEditId">

   <div class="form-grid">

    <div class="field">
     <label for="incomeDate">তারিখ</label>
     <input type="date" id="incomeDate" required>
    </div>

    <div class="field">
     <label for="incomeItem">আয়ের নাম</label>
     <input
      type="text"
      id="incomeItem"
      placeholder="যেমন: বেতন"
      required
     >
    </div>

    <div class="field">
     <label for="incomeAmount">পরিমাণ (₹)</label>
     <input
      type="number"
      id="incomeAmount"
      min="0"
      step="0.01"
      placeholder="0.00"
      required
     >
    </div>

    <div class="field">
     <label for="incomeNote">নোট</label>
     <input
      type="text"
      id="incomeNote"
      placeholder="ঐচ্ছিক"
     >
    </div>

   </div>

   <div class="form-actions">

    <button class="primary-btn" type="submit" id="incomeSubmitBtn">
     আয় যোগ করুন
    </button>

    <button
     class="secondary-btn"
     type="button"
     onclick="resetIncomeForm()"
     id="incomeCancelBtn"
     style="display:none"
    >
     বাতিল
    </button>

   </div>

  </form>

 </section>

 <!-- EXPENSE -->
 <section class="section box">

  <div class="section-title">
   <h2>💸 খরচ যোগ করুন</h2>
  </div>

  <form id="expenseForm" onsubmit="saveExpense(event)">

   <input type="hidden" id="expenseEditId">

   <div class="form-grid">

    <div class="field">
     <label for="expenseDate">তারিখ</label>
     <input type="date" id="expenseDate" required>
    </div>

    <div class="field">
     <label for="expenseCategory">ক্যাটাগরি</label>
     <select id="expenseCategory" required></select>
    </div>

    <div class="field">
     <label for="expenseItem">খরচের নাম</label>
     <input
      type="text"
      id="expenseItem"
      placeholder="যেমন: রুই মাছ"
      required
     >
    </div>

    <div class="field">
     <label for="expenseAmount">পরিমাণ (₹)</label>
     <input
      type="number"
      id="expenseAmount"
      min="0"
      step="0.01"
      placeholder="0.00"
      required
     >
    </div>

    <div class="field full">
     <label for="expenseNote">নোট</label>
     <textarea
      id="expenseNote"
      placeholder="প্রয়োজনে বিস্তারিত লিখুন"
     ></textarea>
    </div>

   </div>

   <div class="form-actions">

    <button class="primary-btn" type="submit" id="expenseSubmitBtn">
     খরচ যোগ করুন
    </button>

    <button
     class="secondary-btn"
     type="button"
     onclick="resetExpenseForm()"
     id="expenseCancelBtn"
     style="display:none"
    >
     বাতিল
    </button>

   </div>

  </form>

 </section>

 <!-- FILTER -->
 <section class="filter-box box">

  <div class="section-title">
   <h2>🔎 খুঁজুন / ফিল্টার</h2>
  </div>

  <div class="filter-row">

   <input
    type="search"
    id="searchInput"
    placeholder="নাম বা নোট লিখুন..."
    oninput="renderAll()"
   >

   <select id="filterCategory" onchange="renderAll()">
    <option value="">সব ক্যাটাগরি</option>
   </select>

   <select id="filterPeriod" onchange="renderAll()">
    <option value="all">সব সময়</option>
    <option value="today">আজ</option>
    <option value="month">এই মাস</option>
    <option value="year">এই বছর</option>
   </select>

  </div>

 </section>

 <!-- EXPENSE LIST -->
 <section class="section box">

  <div class="section-title">
   <h2>🧾 খরচের তালিকা</h2>
   <button type="button" onclick="clearAllExpenses()">
    সব মুছুন
   </button>
  </div>

  <div class="list" id="expenseList"></div>

 </section>

 <!-- INCOME LIST -->
 <section class="section box">

  <div class="section-title">
   <h2>💵 আয়ের তালিকা</h2>
   <button type="button" onclick="clearAllIncomes()">
    সব মুছুন
   </button>
  </div>

  <div class="list" id="incomeList"></div>

 </section>

</main>

<!-- CATEGORY MODAL -->
<div class="modal" id="categoryModal">

 <div class="modal-box">

  <div class="modal-head">
   <h2>🏷️ ক্যাটাগরি ম্যানেজার</h2>

   <button
    class="close-btn"
    type="button"
    onclick="closeCategoryModal()"
   >
    ×
   </button>
  </div>

  <form onsubmit="addCategory(event)">

   <div class="field">
    <label for="newCategory">নতুন ক্যাটাগরি</label>

    <input
     type="text"
     id="newCategory"
     placeholder="যেমন: ওষুধ"
     required
    >
   </div>

   <div class="form-actions">

    <button class="primary-btn" type="submit">
     ক্যাটাগরি যোগ করুন
    </button>

   </div>

  </form>

  <div
   class="category-list"
   id="categoryList"
  ></div>

 </div>

</div>

<!-- CHART MODAL -->
<div class="modal" id="chartModal">

 <div class="modal-box">

  <div class="modal-head">

   <h2>📊 খরচের চার্ট</h2>

   <button
    class="close-btn"
    type="button"
    onclick="closeChartModal()"
   >
    ×
   </button>

  </div>

  <div style="margin-bottom:12px">

   <select
    id="chartPeriod"
    onchange="renderChart()"
    style="
     width:100%;
     padding:10px;
     border:1px solid #dce7e7;
     border-radius:10px;
     background:#fff;
    "
   >

    <option value="today">আজ</option>
    <option value="month">এই মাস</option>
    <option value="year">এই বছর</option>

   </select>

  </div>

  <div id="chartArea" class="chart-area"></div>

 </div>

</div>

<!-- CONFIRM MODAL -->
<div class="modal" id="confirmModal">

 <div class="modal-box">

  <div class="modal-head">

   <h2 id="confirmTitle">নিশ্চিত করুন</h2>

   <button
    class="close-btn"
    type="button"
    onclick="closeConfirmModal()"
   >
    ×
   </button>

  </div>

  <div
   class="confirm-text"
   id="confirmText"
  ></div>

  <div class="confirm-actions">

   <button
    class="secondary-btn"
    type="button"
    onclick="closeConfirmModal()"
   >
    বাতিল
   </button>

   <button
    class="danger-btn"
    type="button"
    id="confirmOkBtn"
   >
    মুছে ফেলুন
   </button>

  </div>

 </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   STORAGE
========================================================= */

const EXPENSE_KEY = "myExpenseData";
const CATEGORY_KEY = "myExpenseCategories";
const INCOME_KEY = "myIncomeData";


/* =========================================================
   DEFAULT CATEGORIES
========================================================= */

const DEFAULT_CATEGORIES = [
 "বাজার",
 "সবজি",
 "মাছ",
 "মাংস",
 "চাল / ডাল",
 "যাতায়াত",
 "বিদ্যুৎ",
 "মোবাইল",
 "বাড়ি",
 "অন্যান্য"
];


/* =========================================================
   DATA
========================================================= */

let expenses = [];
let incomes = [];
let categories = [];

let confirmAction = null;


/* =========================================================
   DOM READY
========================================================= */

document.addEventListener("DOMContentLoaded",function(){

 loadAll();

 setDefaultDates();

 populateCategories();

 renderAll();

});


/* =========================================================
   LOAD DATA
========================================================= */

function loadAll(){

 try{

  const savedExpenses =
   localStorage.getItem(EXPENSE_KEY);

  const savedCategories =
   localStorage.getItem(CATEGORY_KEY);

  const savedIncomes =
   localStorage.getItem(INCOME_KEY);


  expenses =
   savedExpenses
   ? JSON.parse(savedExpenses)
   : [];


  incomes =
   savedIncomes
   ? JSON.parse(savedIncomes)
   : [];


  categories =
   savedCategories
   ? JSON.parse(savedCategories)
   : [...DEFAULT_CATEGORIES];


  if(!Array.isArray(expenses)){
   expenses=[];
  }

  if(!Array.isArray(incomes)){
   incomes=[];
  }

  if(!Array.isArray(categories) || categories.length===0){
   categories=[...DEFAULT_CATEGORIES];
  }

 }catch(error){

  console.error(error);

  expenses=[];
  incomes=[];
  categories=[...DEFAULT_CATEGORIES];

 }

}

/* =========================================================
   DATE
========================================================= */

function getToday(){

 const d=new Date();

 const year=d.getFullYear();

 const month=
  String(d.getMonth()+1).padStart(2,"0");

 const day=
  String(d.getDate()).padStart(2,"0");

 return `${year}-${month}-${day}`;

}


function getCurrentMonth(){

 return getToday().slice(0,7);

}


function getCurrentYear(){

 return getToday().slice(0,4);

}


function setDefaultDates(){

 const today=getToday();

 document.getElementById("expenseDate").value=today;

 document.getElementById("incomeDate").value=today;

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

 const num=Number(value)||0;

 return "₹"+num.toLocaleString(
  "en-IN",
  {
   minimumFractionDigits:2,
   maximumFractionDigits:2
  }
 );

}
